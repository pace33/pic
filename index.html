<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 학교 구석구석</title>
  <style>
    :root {
      --paper: #fffaf0;
      --panel: #ffffff;
      --ink: #334155;
      --muted: #64748b;
      --sky: #7dd3fc;
      --mint: #86efac;
      --peach: #fdba74;
      --pink: #f9a8d4;
      --yellow: #fde68a;
      --line: #d9edf7;
      --shadow: 0 18px 40px rgba(51, 65, 85, 0.14);
      --radius: 24px;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(125, 211, 252, 0.35) 0 110px, transparent 112px),
        radial-gradient(circle at 92% 18%, rgba(249, 168, 212, 0.32) 0 120px, transparent 122px),
        linear-gradient(135deg, #fff7ed 0%, #f0f9ff 48%, #f7fee7 100%);
    }

    .page {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 26px 0 34px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: min(188px, 36vw);
      height: auto;
      flex: 0 0 auto;
      display: block;
      border: 4px solid #ffffff;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 10px 22px rgba(14, 165, 233, 0.18);
      padding: 6px 10px;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.7vw, 2.5rem);
      line-height: 1.15;
      letter-spacing: 0;
      border-radius: 14px;
      outline: none;
      padding: 3px 6px;
      margin-left: -6px;
      transition: background 0.18s ease, box-shadow 0.18s ease;
    }

    h1:hover,
    h1:focus {
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 0 0 4px rgba(125, 211, 252, 0.24);
    }

    h1:empty::before {
      content: "우리 학교 구석구석";
      color: #94a3b8;
    }

    .top p {
      margin: 6px 0 0;
      color: var(--muted);
      font-weight: 700;
    }

    .count-badge {
      flex: 0 0 auto;
      min-width: 94px;
      padding: 12px 14px;
      border: 3px solid #ffffff;
      border-radius: 20px;
      background: var(--yellow);
      text-align: center;
      box-shadow: 0 9px 18px rgba(245, 158, 11, 0.15);
      font-weight: 900;
    }

    .count-badge span {
      display: block;
      margin-top: 2px;
      font-size: 1.55rem;
    }



    .section-nav {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      margin: 0 0 18px;
    }

    .section-item {
      position: relative;
      min-width: 0;
    }

    .section-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      width: 100%;
      padding: 10px;
      border: 3px solid #ffffff;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.82);
      color: #37506c;
      text-decoration: none;
      font-weight: 1000;
      box-shadow: 0 8px 18px rgba(51, 65, 85, 0.10);
      transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    .section-link:hover,
    .section-link:focus {
      transform: translateY(-2px);
      background: #ffffff;
      box-shadow: 0 12px 24px rgba(51, 65, 85, 0.16);
      outline: none;
    }

    .section-link.active {
      background: linear-gradient(135deg, #fde68a, #fdba74);
      color: #7c2d12;
      box-shadow: 0 12px 26px rgba(251, 146, 60, 0.22);
    }

    .section-label[contenteditable="true"] {
      display: inline-block;
      min-width: 4.5em;
      max-width: 100%;
      padding: 2px 4px;
      border-radius: 8px;
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
    }

    .section-label:focus {
      outline: 3px solid rgba(14, 165, 233, 0.22);
      background: rgba(255, 255, 255, 0.62);
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 22px;
      align-items: start;
    }

    .panel,
    .gallery-wrap {
      border: 4px solid #ffffff;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
    }

    .panel {
      position: sticky;
      top: 18px;
      overflow: hidden;
    }

    .panel-header {
      padding: 18px 18px 14px;
      background: linear-gradient(135deg, #bae6fd, #bbf7d0);
      border-bottom: 3px dashed rgba(51, 65, 85, 0.16);
    }

    .panel-header h2,
    .gallery-title h2 {
      margin: 0;
      font-size: 1.22rem;
      letter-spacing: 0;
    }

    .panel-header p,
    .gallery-title p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
      font-weight: 700;
    }

    form {
      padding: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 0.93rem;
      font-weight: 900;
    }

    .field {
      margin-bottom: 15px;
    }

    input[type="text"],
    input[type="date"] {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 2px solid var(--line);
      border-radius: 15px;
      background: #f8fdff;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    input:focus {
      border-color: #38bdf8;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.18);
    }

    .drop-zone {
      display: grid;
      place-items: center;
      min-height: 190px;
      padding: 16px;
      border: 3px dashed #93c5fd;
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(219, 234, 254, 0.7), rgba(254, 243, 199, 0.72));
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .drop-zone:hover,
    .drop-zone.dragging {
      transform: translateY(-2px);
      border-color: #fb7185;
      background: linear-gradient(135deg, rgba(224, 242, 254, 0.95), rgba(255, 237, 213, 0.95));
    }

    .drop-zone input {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .upload-empty {
      display: grid;
      gap: 10px;
      justify-items: center;
      color: var(--muted);
      font-weight: 800;
    }

    .upload-icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: inset 0 -5px 0 rgba(125, 211, 252, 0.24);
      position: relative;
    }

    .upload-icon::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 18px;
      width: 28px;
      height: 22px;
      border: 4px solid #38bdf8;
      border-top: 0;
      border-radius: 0 0 8px 8px;
    }

    .upload-icon::after {
      content: "";
      position: absolute;
      left: 22px;
      top: 12px;
      width: 14px;
      height: 14px;
      border-left: 4px solid #fb7185;
      border-top: 4px solid #fb7185;
      transform: rotate(45deg);
    }

    .preview {
      display: none;
      width: 100%;
    }

    .preview.active {
      display: block;
    }

    .preview img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 15px;
      display: block;
      border: 3px solid #ffffff;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.12);
    }

    .preview-name {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 17px;
      min-height: 48px;
      padding: 12px 16px;
      color: #253247;
      font: inherit;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(51, 65, 85, 0.12);
      transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 22px rgba(51, 65, 85, 0.16);
    }

    button:active {
      transform: translateY(0);
      filter: brightness(0.98);
    }

    .primary {
      background: linear-gradient(135deg, #fdba74, #f9a8d4);
    }

    .secondary {
      background: #e0f2fe;
      min-width: 52px;
    }

    .notice {
      display: none;
      margin-top: 12px;
      padding: 11px 12px;
      border-radius: 14px;
      background: #fff1f2;
      color: #be123c;
      font-weight: 900;
      line-height: 1.45;
    }

    .notice.show {
      display: block;
    }

    .gallery-wrap {
      min-height: 640px;
      padding: 20px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.9)),
        repeating-linear-gradient(0deg, transparent 0 35px, rgba(125, 211, 252, 0.18) 36px 38px),
        repeating-linear-gradient(90deg, transparent 0 35px, rgba(134, 239, 172, 0.16) 36px 38px);
    }

    .gallery-title {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .gallery-title strong {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      font-size: 0.9rem;
      box-shadow: inset 0 -3px 0 rgba(251, 191, 36, 0.3);
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 500px;
      text-align: center;
      color: var(--muted);
      font-weight: 800;
    }

    .empty-card {
      width: min(410px, 100%);
      padding: 26px;
      border: 3px dashed #bae6fd;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.72);
    }

    .empty-picture {
      width: 128px;
      height: 92px;
      margin: 0 auto 14px;
      border: 5px solid #ffffff;
      border-radius: 18px;
      background:
        radial-gradient(circle at 78% 24%, #facc15 0 13px, transparent 14px),
        linear-gradient(135deg, #bae6fd 0 52%, #bbf7d0 53% 100%);
      box-shadow: 0 12px 24px rgba(14, 165, 233, 0.15);
      position: relative;
    }

    .empty-picture::before,
    .empty-picture::after {
      content: "";
      position: absolute;
      bottom: 10px;
      width: 54px;
      height: 34px;
      border-radius: 999px 999px 10px 10px;
      background: #86efac;
    }

    .empty-picture::before {
      left: 16px;
      transform: rotate(-8deg);
    }

    .empty-picture::after {
      right: 13px;
      background: #34d399;
      transform: rotate(8deg);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
    }

    .card {
      appearance: none;
      width: 100%;
      min-height: 0;
      padding: 0;
      border: 3px solid #ffffff;
      border-radius: 20px;
      background: #ffffff;
      overflow: hidden;
      text-align: left;
      box-shadow: 0 12px 24px rgba(51, 65, 85, 0.12);
    }

    .card:hover img {
      transform: scale(1.035);
    }

    .thumb {
      position: relative;
      overflow: hidden;
      background: #e0f2fe;
    }

    .thumb img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }

    .zoom-hint {
      position: absolute;
      right: 10px;
      bottom: 10px;
      min-width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 8px 14px rgba(15, 23, 42, 0.18);
    }

    .zoom-hint::before {
      content: "";
      width: 15px;
      height: 15px;
      border: 3px solid #38bdf8;
      border-radius: 50%;
      box-shadow: 9px 9px 0 -5px #fb7185;
    }

    .delete-card {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 38px;
      min-height: 38px;
      padding: 0;
      border: 3px solid #ffffff;
      border-radius: 14px;
      background: #ffe4e6;
      box-shadow: 0 8px 14px rgba(15, 23, 42, 0.18);
    }

    .delete-card::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 14px;
      width: 12px;
      height: 14px;
      border: 3px solid #e11d48;
      border-top: 0;
      border-radius: 0 0 4px 4px;
      background: transparent;
    }

    .delete-card::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 9px;
      width: 18px;
      height: 4px;
      border-radius: 999px;
      background: #e11d48;
    }

    .delete-card span {
      position: absolute;
      left: 15px;
      top: 6px;
      width: 8px;
      height: 3px;
      border-radius: 999px;
      background: #e11d48;
    }

    .card-info {
      padding: 13px 14px 15px;
    }

    .card-title {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .pill {
      max-width: 100%;
      padding: 6px 9px;
      border-radius: 999px;
      background: #ecfccb;
      color: #3f6212;
      font-size: 0.8rem;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .pill.date {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      padding: 22px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
    }

    .modal.show {
      display: grid;
      place-items: center;
    }

    .modal-card {
      width: min(920px, 100%);
      max-height: calc(100vh - 44px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      border: 4px solid #ffffff;
      border-radius: 24px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
    }

    .modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #fef3c7, #d9f99d);
    }

    .modal-title {
      min-width: 0;
    }

    .modal-title h3 {
      margin: 0;
      font-size: 1.15rem;
      overflow-wrap: anywhere;
    }

    .modal-title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-weight: 800;
    }

    .modal-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
    }

    .modal-delete,
    .close {
      flex: 0 0 auto;
      width: 46px;
      min-height: 46px;
      padding: 0;
      background: #ffffff;
      border-radius: 15px;
      position: relative;
    }

    .modal-delete::before {
      content: "";
      position: absolute;
      left: 14px;
      top: 18px;
      width: 14px;
      height: 16px;
      border: 3px solid #e11d48;
      border-top: 0;
      border-radius: 0 0 5px 5px;
    }

    .modal-delete::after {
      content: "";
      position: absolute;
      left: 11px;
      top: 13px;
      width: 22px;
      height: 4px;
      border-radius: 999px;
      background: #e11d48;
      box-shadow: 7px -5px 0 -2px #e11d48;
    }

    .close::before,
    .close::after {
      content: "";
      position: absolute;
      left: 14px;
      top: 21px;
      width: 18px;
      height: 4px;
      border-radius: 999px;
      background: #fb7185;
    }

    .close::before {
      transform: rotate(45deg);
    }

    .close::after {
      transform: rotate(-45deg);
    }

    .modal-image-wrap {
      display: grid;
      place-items: center;
      min-height: 0;
      background: #f8fafc;
    }

    .modal-image-wrap img {
      max-width: 100%;
      max-height: calc(100vh - 178px);
      display: block;
      object-fit: contain;
    }

    .modal-bottom {
      padding: 12px 16px;
      color: var(--muted);
      font-weight: 800;
      background: #ffffff;
      overflow-wrap: anywhere;
    }

    @media (max-width: 860px) {
      .top {
        align-items: flex-start;
      }

      .workspace {
        grid-template-columns: 1fr;
      }


      .section-nav {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .panel {
        position: static;
      }

      .gallery-wrap {
        min-height: 420px;
      }

      .empty-state {
        min-height: 300px;
      }
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 18px, 1180px);
        padding-top: 14px;
      }

      .top {
        display: grid;
      }

      .brand-mark {
        width: min(148px, 42vw);
        height: auto;
      }

      .count-badge {
        width: 100%;
      }

      .panel-header,
      form,
      .gallery-wrap {
        padding: 14px;
      }

      .gallery-title {
        display: grid;
        align-items: start;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .secondary {
        width: 100%;
      }

      .modal {
        padding: 10px;
      }

      .modal-card {
        max-height: calc(100vh - 20px);
        border-radius: 20px;
      }

      .modal-image-wrap img {
        max-height: calc(100vh - 184px);
      }
    }
  </style>
</head>
<body>
  <main class="page">

  <script>
    const form = document.querySelector("#artForm");
    const mainTitle = document.querySelector("#mainTitle");
    const imageInput = document.querySelector("#imageInput");
    const titleInput = document.querySelector("#titleInput");
    const classInput = document.querySelector("#classInput");
    const dateInput = document.querySelector("#dateInput");
    const dropZone = document.querySelector("#dropZone");
    const uploadEmpty = document.querySelector("#uploadEmpty");
    const preview = document.querySelector("#preview");
    const previewImage = document.querySelector("#previewImage");
    const previewName = document.querySelector("#previewName");
    const notice = document.querySelector("#notice");
    const gallery = document.querySelector("#gallery");
    const emptyState = document.querySelector("#emptyState");
    const count = document.querySelector("#count");
    const clearButton = document.querySelector("#clearButton");
    const todayLabel = document.querySelector("#todayLabel");
    const modal = document.querySelector("#modal");
    const deleteModalArtwork = document.querySelector("#deleteModalArtwork");
    const closeModal = document.querySelector("#closeModal");
    const modalTitle = document.querySelector("#modalTitle");
    const modalMeta = document.querySelector("#modalMeta");
    const modalImage = document.querySelector("#modalImage");
    const modalCaption = document.querySelector("#modalCaption");
    const sectionNames = {
      "1": "1번 링크",
      "2": "2번 링크",
      "3": "3번 링크",
      "4": "4번 링크",
      "5": "5번 링크",
      "6": "6번 링크"
    };
    const defaultSiteTitle = "우리 학교 구석구석";
    const currentSection = detectSection();
    const collectionName = `photos_${currentSection}`;
    const settingsCollectionName = "site_settings";
    const apiBase = location.hostname === "aiedue.ddns.net" ? "/pic-db/db-api" : "https://aiedue.ddns.net/pic-db/db-api";
    const maxUploadDimension = 1600;
    const maxOriginalUploadBytes = 1800000;

    let selectedImage = "";
    let selectedFile = null;
    let selectedFileName = "";
    let activeModalArtworkId = "";
    let artworks = [];
    const deletedArtworkIds = new Set();

    const today = new Date();
    const todayIso = new Date(today.getTime() - today.getTimezoneOffset() * 60000)
      .toISOString()
      .slice(0, 10);

    function detectSection() {
      const pathMatch = location.pathname.match(/\/pic\/([1-6])\/?$/) || location.pathname.match(/\/([1-6])\/?$/);
      const querySection = new URLSearchParams(location.search).get("section");
      return (pathMatch && pathMatch[1]) || (/^[1-6]$/.test(querySection || "") ? querySection : "1");
    }

    function sectionUrl(section) {
      return `https://aiedue.ddns.net/pic/${section}/`;
    }

    function encodeStoragePath(path) {
      return path.split("/").map(encodeURIComponent).join("/");
    }

    function setBusy(isBusy) {
      form.querySelectorAll("button, input").forEach((el) => { el.disabled = isBusy; });
    }

    function storageSectionNameKey(section) {
      return `schoolGallerySectionName:${section}`;
    }

    function getSectionName(section) {
      return localStorage.getItem(storageSectionNameKey(section)) || sectionNames[section] || `${section}번 링크`;
    }

    function setSectionName(section, name) {
      const previousDefault = `${getSectionName(section)} · ${defaultSiteTitle}`;
      const cleanName = name.trim() || sectionNames[section] || `${section}번 링크`;
      localStorage.setItem(storageSectionNameKey(section), cleanName);
      sectionNames[section] = cleanName;
      const label = document.querySelector(`[data-section-label="${section}"]`);
      if (label) label.textContent = cleanName;
      if (section === currentSection) {
        const currentTitle = mainTitle.textContent.trim();
        if (!currentTitle || currentTitle === previousDefault) {
          updateSiteTitle(`${cleanName} · ${defaultSiteTitle}`);
        }
      }
    }

    function updateSiteTitle(value) {
      const sectionTitle = `${getSectionName(currentSection)} · ${defaultSiteTitle}`;
      const title = value.trim() || sectionTitle;
      mainTitle.textContent = title;
      document.title = title;
      localStorage.setItem(`schoolGalleryTitle:${currentSection}`, title);
    }

    document.querySelectorAll("[data-section-link]").forEach((link) => {
      const section = link.getAttribute("data-section-link");
      sectionNames[section] = getSectionName(section);
      const label = document.querySelector(`[data-section-label="${section}"]`);
      if (label) {
        label.textContent = sectionNames[section];
        label.dataset.previousName = sectionNames[section];
      }
      link.href = sectionUrl(section);
      if (section === currentSection) {
        link.classList.add("active");
        link.setAttribute("aria-current", "page");
      }
    });

    document.querySelectorAll("[data-section-label]").forEach((label) => {
      const section = label.getAttribute("data-section-label");
      label.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        label.focus();
      });
      label.addEventListener("focus", () => {
        label.dataset.previousName = getSectionName(section);
      });
      label.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          label.blur();
        }
        if (event.key === "Escape") {
          event.preventDefault();
          label.textContent = label.dataset.previousName || getSectionName(section);
          label.blur();
        }
      });
      label.addEventListener("blur", () => {
        const nextName = label.textContent.trim();
        setSectionName(section, nextName);
        if (getSectionName(section) !== label.dataset.previousName) {
          saveSetting("sectionName", section, getSectionName(section));
        }
        label.dataset.previousName = getSectionName(section);
      });
    });

    const savedSiteTitle = localStorage.getItem(`schoolGalleryTitle:${currentSection}`) || `${getSectionName(currentSection)} · ${defaultSiteTitle}`;
    updateSiteTitle(savedSiteTitle);

    dateInput.value = todayIso;
    todayLabel.textContent = new Intl.DateTimeFormat("ko-KR", {
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "short"
    }).format(today);

    function showNotice(message) {
      notice.textContent = message;
      notice.classList.add("show");
    }

    function hideNotice() {
      notice.textContent = "";
      notice.classList.remove("show");
    }

    function formatDate(value) {
      if (!value) return "";
      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric"
      }).format(new Date(`${value}T00:00:00`));
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function fileExtension(file) {
      const byName = (file.name || "").toLowerCase().match(/\.([a-z0-9]+)$/);
      const ext = byName ? byName[1] : (file.type.split("/")[1] || "jpg");
      return ["jpg", "jpeg", "png", "gif", "webp"].includes(ext) ? ext : "jpg";
    }

    function imageUrlForPath(storagePath) {
      return `${apiBase}/storage/files/${encodeStoragePath(storagePath)}`;
    }

    function resizeImageFile(file) {
      if (file.size <= maxOriginalUploadBytes && file.type !== "image/bmp" && file.type !== "image/tiff") {
        return Promise.resolve({
          blob: file,
          ext: fileExtension(file),
          contentType: file.type || "application/octet-stream",
          wasCompressed: false
        });
      }

      return new Promise((resolve, reject) => {
        const image = new Image();
        const objectUrl = URL.createObjectURL(file);

        image.addEventListener("load", () => {
          URL.revokeObjectURL(objectUrl);
          const scale = Math.min(1, maxUploadDimension / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const context = canvas.getContext("2d");
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          canvas.toBlob((blob) => {
            if (!blob) {
              reject(new Error("사진을 저장용으로 변환하지 못했어요."));
              return;
            }
            resolve({
              blob,
              ext: "jpg",
              contentType: "image/jpeg",
              wasCompressed: true
            });
          }, "image/jpeg", 0.84);
        }, { once: true });

        image.addEventListener("error", () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error("사진 파일을 읽지 못했어요."));
        }, { once: true });

        image.src = objectUrl;
      });
    }

    function friendlySaveError(error) {
      const message = error && error.message ? error.message : String(error || "");
      if (message === "Failed to fetch" || message === "NetworkError when attempting to fetch resource.") {
        return "저장 서버에 연결하지 못했어요. https://aiedue.ddns.net/pic/ 주소에서 열었는지 확인하고, 사진 용량을 줄여 다시 시도해 주세요.";
      }
      return message;
    }

    function loadImage(file) {
      hideNotice();
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        showNotice("이미지 파일만 등록할 수 있어요.");
        imageInput.value = "";
        return;
      }

      selectedFile = file;
      const reader = new FileReader();
      reader.addEventListener("load", () => {
        selectedImage = reader.result;
        selectedFileName = file.name;
        previewImage.src = selectedImage;
        previewName.textContent = selectedFileName;
        preview.classList.add("active");
        uploadEmpty.style.display = "none";
      });
      reader.readAsDataURL(file);
    }

    function resetForm() {
      form.reset();
      dateInput.value = todayIso;
      imageInput.value = "";
      selectedImage = "";
      selectedFile = null;
      selectedFileName = "";
      previewImage.removeAttribute("src");
      previewName.textContent = "";
      preview.classList.remove("active");
      uploadEmpty.style.display = "grid";
      hideNotice();
    }

    function normalizeArtwork(record) {
      const data = record.data || record;
      return {
        id: record.id || data.id || String(Date.now()),
        image: data.storagePath ? imageUrlForPath(data.storagePath) : data.image,
        storagePath: data.storagePath || "",
        title: data.title || "제목 없는 사진",
        className: data.className || data.class || "학년반 없음",
        date: data.date || todayIso,
        fileName: data.fileName || "photo",
        bytes: data.bytes || 0,
        createdAt: data.createdAt || record.created_at || ""
      };
    }

    async function apiJson(path, options = {}) {
      const response = await fetch(`${apiBase}${path}`, {
        ...options,
        headers: {
          ...(options.body && !(options.body instanceof Blob) ? { "Content-Type": "application/json; charset=utf-8" } : {}),
          ...(options.headers || {})
        }
      });
      if (!response.ok) {
        let detail = "";
        try { detail = (await response.json()).error || ""; } catch (_) { detail = await response.text(); }
        throw new Error(detail || `HTTP ${response.status}`);
      }
      return await response.json();
    }

    async function saveSetting(kind, section, value) {
      const cleanValue = String(value || "").trim();
      if (!cleanValue) return;

      try {
        await apiJson(`/items/${encodeURIComponent(settingsCollectionName)}`, {
          method: "POST",
          body: JSON.stringify({
            data: {
              kind,
              section,
              value: cleanValue,
              pagePath: `/pic/${section}`,
              createdAt: new Date().toISOString()
            }
          })
        });
      } catch (error) {
        console.error(error);
        showNotice(`저장 실패: ${friendlySaveError(error)}`);
      }
    }

    async function loadSiteSettings() {
      try {
        const data = await apiJson(`/items/${encodeURIComponent(settingsCollectionName)}?limit=300`);
        const settings = (data.items || [])
          .map((record) => {
            const setting = record.data || {};
            return { id: record.id, ...setting, savedAt: setting.createdAt || record.created_at };
          })
          .sort((a, b) => new Date(a.savedAt || 0) - new Date(b.savedAt || 0));

        settings.forEach((setting) => {
          if (!/^[1-6]$/.test(setting.section || "") || !setting.value) return;
          if (setting.kind === "sectionName") {
            setSectionName(setting.section, setting.value);
          }
          if (setting.kind === "siteTitle" && setting.section === currentSection) {
            updateSiteTitle(setting.value);
          }
          if (setting.kind === "deletedArtwork" && setting.section === currentSection) {
            deletedArtworkIds.add(setting.value);
          }
        });
      } catch (error) {
        if (!String(error.message || "").includes("Collection not found")) {
          console.error(error);
        }
      }
    }

    async function loadArtworks() {
      try {
        showNotice(`${getSectionName(currentSection)} 사진을 불러오는 중이에요...`);
        const data = await apiJson(`/items/${encodeURIComponent(collectionName)}?limit=200`);
        artworks = (data.items || [])
          .map(normalizeArtwork)
          .filter((item) => !deletedArtworkIds.has(item.id))
          .reverse();
        renderGallery();
        hideNotice();
      } catch (error) {
        console.error(error);
        showNotice(`사진 목록을 불러오지 못했어요: ${error.message}`);
      }
    }

    function renderGallery() {
      gallery.innerHTML = "";
      emptyState.style.display = artworks.length ? "none" : "grid";
      count.textContent = artworks.length;

      artworks.forEach((item) => {
        const card = document.createElement("article");
        card.className = "card";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", `${item.title} 크게 보기`);

        card.innerHTML = `
          <span class="thumb">
            <img src="${item.image}" alt="${escapeHtml(item.title)}" loading="lazy">
            <button class="delete-card" type="button" aria-label="${escapeHtml(item.title)} 화면에서 숨기기"><span aria-hidden="true"></span></button>
            <span class="zoom-hint" aria-hidden="true"></span>
          </span>
          <span class="card-info">
            <strong class="card-title">${escapeHtml(item.title)}</strong>
            <span class="meta">
              <span class="pill">${escapeHtml(item.className)}</span>
              <span class="pill date">${formatDate(item.date)}</span>
            </span>
          </span>
        `;

        card.addEventListener("click", () => openModal(item));
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openModal(item);
          }
        });
        card.querySelector(".delete-card").addEventListener("click", (event) => {
          event.stopPropagation();
          deleteArtwork(item.id);
        });
        gallery.prepend(card);
      });
    }

    function removeArtworkFromView(id) {
      const index = artworks.findIndex((item) => item.id === id);
      if (index === -1) return;
      artworks.splice(index, 1);
      renderGallery();
    }

    async function deleteArtwork(id) {
      const item = artworks.find((artwork) => artwork.id === id);
      if (!item) return;

      try {
        showNotice("삽화를 삭제하는 중이에요...");
        try {
          await apiJson(`/items/${encodeURIComponent(collectionName)}/${encodeURIComponent(id)}`, {
            method: "DELETE"
          });
          if (item.storagePath) {
            try {
              await fetch(`${apiBase}/storage/files/${encodeStoragePath(item.storagePath)}`, { method: "DELETE" });
            } catch (_) {}
          }
        } catch (_) {
          await saveSetting("deletedArtwork", currentSection, id);
        }
        deletedArtworkIds.add(id);
        removeArtworkFromView(id);
        if (activeModalArtworkId === id) closeImageModal();
        showNotice("삭제했어요. 새로고침해도 목록에 다시 보이지 않습니다.");
      } catch (error) {
        console.error(error);
        showNotice(`삭제 실패: ${friendlySaveError(error)}`);
      }
    }

    function openModal(item) {
      activeModalArtworkId = item.id;
      modalTitle.textContent = item.title;
      modalMeta.textContent = `${item.className} · ${formatDate(item.date)} · ${getSectionName(currentSection)}`;
      modalCaption.textContent = item.fileName;
      modalImage.src = item.image;
      modalImage.alt = item.title;
      modal.classList.add("show");
      closeModal.focus();
    }

    function closeImageModal() {
      modal.classList.remove("show");
      modalImage.removeAttribute("src");
      activeModalArtworkId = "";
    }

    imageInput.addEventListener("change", (event) => {
      loadImage(event.target.files[0]);
    });

    dropZone.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropZone.classList.add("dragging");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragging");
    });

    dropZone.addEventListener("drop", (event) => {
      event.preventDefault();
      dropZone.classList.remove("dragging");
      const file = event.dataTransfer.files[0];
      if (file) {
        imageInput.files = event.dataTransfer.files;
        loadImage(file);
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const title = titleInput.value.trim();
      const className = classInput.value.trim();
      const date = dateInput.value;

      if (!selectedFile || !selectedImage) {
        showNotice("삽화 사진을 먼저 선택해 주세요.");
        return;
      }

      if (!title || !className || !date) {
        showNotice("제목, 학년반, 날짜를 모두 입력해 주세요.");
        return;
      }

      const id = window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now());

      try {
        setBusy(true);
        showNotice("사진을 저장용으로 준비하는 중이에요...");
        const uploadFile = await resizeImageFile(selectedFile);
        const ext = uploadFile.ext;
        const storagePath = `${currentSection}/${date}/${id}.${ext}`;
        const payload = {
          id,
          section: currentSection,
          title,
          className,
          date,
          fileName: selectedFileName,
          storagePath,
          bytes: uploadFile.blob.size,
          originalBytes: selectedFile.size,
          contentType: uploadFile.contentType,
          compressed: uploadFile.wasCompressed,
          createdAt: new Date().toISOString(),
          pagePath: `/pic/${currentSection}`
        };
        showNotice("사진을 에이두 데이터 서버에 저장하는 중이에요...");
        const upload = await fetch(`${apiBase}/storage/files/${encodeStoragePath(storagePath)}`, {
          method: "PUT",
          headers: { "Content-Type": uploadFile.contentType },
          body: uploadFile.blob
        });
        if (!upload.ok) {
          let detail = "";
          try { detail = (await upload.json()).error || ""; } catch (_) { detail = await upload.text(); }
          throw new Error(detail || `사진 업로드 실패 HTTP ${upload.status}`);
        }
        const saved = await apiJson(`/items/${encodeURIComponent(collectionName)}`, {
          method: "POST",
          body: JSON.stringify({ data: payload })
        });
        artworks.push(normalizeArtwork(saved.item));
        renderGallery();
        resetForm();
        showNotice(`${getSectionName(currentSection)}에 저장했어요.`);
      } catch (error) {
        console.error(error);
        showNotice(`저장 실패: ${friendlySaveError(error)}`);
      } finally {
        setBusy(false);
      }
    });

    clearButton.addEventListener("click", resetForm);
    deleteModalArtwork.addEventListener("click", () => {
      if (!activeModalArtworkId) return;
      deleteArtwork(activeModalArtworkId);
    });
    closeModal.addEventListener("click", closeImageModal);

    mainTitle.addEventListener("input", () => {
      const title = mainTitle.textContent.trim();
      document.title = title || defaultSiteTitle;
      localStorage.setItem(`schoolGalleryTitle:${currentSection}`, title || `${getSectionName(currentSection)} · ${defaultSiteTitle}`);
    });

    mainTitle.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        mainTitle.blur();
      }
    });

    mainTitle.addEventListener("blur", () => {
      updateSiteTitle(mainTitle.textContent);
      saveSetting("siteTitle", currentSection, mainTitle.textContent);
    });

    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeImageModal();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modal.classList.contains("show")) {
        closeImageModal();
      }
    });

    (async () => {
      await loadSiteSettings();
      await loadArtworks();
    })();
  </script>
</body>
</html>
